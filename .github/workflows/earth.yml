name: Independent Earth Core
on:
  push:
    branches:
      [
        main,
        codex/earth-v04-platform,
        codex/earth-v04-rc,
        codex/earth-v05-intelligence,
      ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  earth:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run earth:test
      - run: npm run earth:sdk:build
      - run: npm run earth:platform:test
      - name: Install independent app from actual SDK tarball
        run: npm ci --prefix apps/energy-explorer --ignore-scripts
      - run: npm run earth:energy:test
      - run: npm run earth:energy:package
      - name: Audit independent application dependencies
        run: npm audit --prefix apps/energy-explorer --audit-level=high
      - name: Verify generated public contract matches source
        run: git diff --exit-code -- earth/contracts/openapi.json
      - run: npm run earth:build
      - run: npm run earth:audit-build
      - run: npm run earth:bench
      - name: Build and rehearse extracted release with rollback
        if: matrix.os == 'ubuntu-latest'
        run: npm run earth:release:build && npm run earth:release:rehearse

  postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull pinned official development database
        run: docker pull --platform linux/amd64 postgis/postgis@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
      - run: npm run earth:db:start
      - name: PostGIS integration and row isolation
        run: |
          export EARTH_TEST_ADMIN_URL_FILE="$HOME/.local/share/finalverse-earth/postgis-dev/admin-url"
          export EARTH_TEST_URL_FILE="$HOME/.local/share/finalverse-earth/postgis-dev/runtime-url"
          npm run earth:test
      - name: Bounded embedded/PostGIS parity and load (isolated database only)
        run: |
          mkdir -p artifacts/release
          export EARTH_DATABASE_URL_FILE="$HOME/.local/share/finalverse-earth/postgis-dev/runtime-url"
          npm run earth:release:load
      - name: Stop this job's development database
        if: always()
        continue-on-error: true
        run: npm run earth:db:stop
