# Dedicated vhost: do not overwrite the existing Finalverse/MutSea configuration.
# Install only after DNS, certificate issuance and staging acceptance.
server {
    listen 80;
    server_name earth.finalverse.com;
    location /.well-known/acme-challenge/ { root /var/www/_acme; }
    location / { return 301 https://earth.finalverse.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name earth.finalverse.com;
    ssl_certificate /etc/letsencrypt/live/earth.finalverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/earth.finalverse.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    client_body_timeout 10s;
    location = /metrics { return 404; }
    location = /v1/datasets { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18640;
        proxy_http_version 1.1;
        proxy_set_header Host earth.finalverse.com;
        # Overwrite; never trust a visitor-provided identity header.
        proxy_set_header X-Earth-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
